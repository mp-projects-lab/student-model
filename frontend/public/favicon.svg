<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Fondo degradado oscuro -->
    <linearGradient id="bgGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>

    <!-- Borde sutil metálico oscuro -->
    <linearGradient id="borderGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4d4d4d" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>

    <!-- Degradado suave blanco a gris claro para el cursor -->
    <linearGradient id="cursorGrad" x1="256" y1="130" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bcbcbc" />
    </linearGradient>

    <!-- Sombra suave -->
    <filter id="cursorShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Contenedor cuadrado redondeado -->
  <rect x="8" y="8" width="496" height="496" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Icono de cursor centrado -->
  <path d="M 159 139
       Q 148 134 151 146
       L 206 353
       Q 209 365 214 354
       L 243 287
       L 309 366
       Q 318 377 329 368
       L 347 353
       Q 358 344 349 333
       L 282 254
       L 353 237
       Q 365 234 354 229
       Z" fill="url(#cursorGrad)" filter="url(#cursorShadow)" />
</svg>